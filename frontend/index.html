    <link

    >

    <style>

        * {

        }

        }

        .navbar {

        }

        .btn {

        }

        .btn:hover {

        .feature {

        .feature-icon {

        }

        .form-container {

                20px auto;

        .form-container h2 {

        }

        }

        .form-group {

            margin-bottom: 15px;

        }

        .form-group label {

        .input {

        ===================================================== */

            height: 44px;

            justify-content: center;

        }

        .payment-status {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .payment-badge {
            padding: 6px 14px;

            color: white;

            font-size: 13px;

        }

        .payment-badge.success {

        }

        .payment-loader {

            }

    </style>

</head>

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_BASE =
    "https://instant-delivery-1.onrender.com/api/v1";


/* =====================================================
   STATE
===================================================== */

let accessToken =
    localStorage.getItem(
        "accessToken"
    );

let currentUser =
    JSON.parse(
        localStorage.getItem(
            "user"
        ) || "null"
    );


/* =====================================================
   API HELPER
===================================================== */

async function api(

    endpoint,

    options = {}

) {

    const headers = {

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };

    if (accessToken) {

        headers.Authorization =
            `Bearer ${accessToken}`;

    }

    const response =
        await fetch(

            API_BASE +
            endpoint,

            {

                ...options,

                headers

            }

        );

    const text =
        await response.text();

    let data = {};

    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }

    catch {

        data = {
            message: text
        };

    }

    if (!response.ok) {

        throw new Error(

            data.message ||

            data.error ||

            "Something went wrong."

        );

    }

    return data;

}


/* =====================================================
   AUTH STATE
===================================================== */

function setAuthentication(

    token,

    user

) {

    accessToken =
        token;

    currentUser =
        user;

    if (token) {

        localStorage.setItem(
            "accessToken",
            token
        );

    }

    else {

        localStorage.removeItem(
            "accessToken"
        );

    }

    if (user) {

        localStorage.setItem(
            "user",
            JSON.stringify(user)
        );

    }

    else {

        localStorage.removeItem(
            "user"
        );

    }

    updateNavigation();

}


function updateNavigation() {

    const loggedIn =
        Boolean(accessToken);

    document
        .getElementById(
            "loginButton"
        )
        .classList
        .toggle(
            "hidden",
            loggedIn
        );

    document
        .getElementById(
            "registerButton"
        )
        .classList
        .toggle(
            "hidden",
            loggedIn
        );

    document
        .getElementById(
            "logoutButton"
        )
        .classList
        .toggle(
            "hidden",
            !loggedIn
        );

    document
        .getElementById(
            "profileButton"
        )
        .classList
        .toggle(
            "hidden",
            !loggedIn
        );

    document
        .getElementById(
            "ordersButton"
        )
        .classList
        .toggle(
            "hidden",
            !loggedIn
        );

    const paymentButton =
        document.getElementById(
            "paymentButton"
        );

    if (paymentButton) {

        paymentButton.classList.toggle(
            "hidden",
            !loggedIn
        );

    }

}

/* =====================================================
   REGISTER
===================================================== */

function showRegister() {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="form-container">

            <h2>
                Create Account
            </h2>

            <p class="subtitle">
                Register your Instant Delivery account.
            </p>

            <div id="registerMessage"></div>

            <form
                onsubmit="register(event)"
            >

                <div class="row">

                    <div class="form-group">

                        <label>
                            First Name
                        </label>

                        <input
                            class="input"
                            id="firstName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Last Name
                        </label>

                        <input
                            class="input"
                            id="lastName"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        class="input"
                        id="registerEmail"
                        type="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        class="input"
                        id="registerPhone"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        class="input"
                        id="registerPassword"
                        type="password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    class="btn"
                    style="width:100%"
                >

                    Register

                </button>

            </form>


            <p
                class="center"
                style="margin-top:18px"
            >

                Already have an account?

                <a
                    href="#"
                    onclick="
                        showLogin();
                        return false;
                    "
                >
                    Login
                </a>

            </p>

    `;

}


/* =====================================================
   REGISTER API
===================================================== */

async function register(event) {

    event.preventDefault();

    const message =
        document.getElementById(
            "registerMessage"
        );

    try {

        const response =
            await api(

                "/auth/register",

                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            first_name:
                                document.getElementById(
                                    "firstName"
                                ).value,

                            last_name:
                                document.getElementById(
                                    "lastName"
                                ).value,

                            email:
                                document.getElementById(
                                    "registerEmail"
                                ).value,

                            phone:
                                document.getElementById(
                                    "registerPhone"
                                ).value,

                            password:
                                document.getElementById(
                                    "registerPassword"
                                ).value

                        })

                }

            );

        showVerifyOTP(
            document.getElementById(
                "registerEmail"
            ).value
        );

    }

    catch (error) {

        message.innerHTML = `

            <div class="alert alert-error">

                ${error.message}

            </div>

        `;

    }

}


/* =====================================================
   VERIFY OTP
===================================================== */

function showVerifyOTP(email) {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="form-container">

            <h2>
                Verify Your Account
            </h2>

            <p class="subtitle">

                Enter the OTP sent to

                <b>
                    ${email}
                </b>

            </p>


            <div id="otpMessage"></div>


            <div class="form-group">

                <label>
                    OTP
                </label>

                <input
                    class="input"
                    id="otp"
                    maxlength="6"
                    required
                >

            </div>


            <button
                class="btn"
                style="width:100%"
                onclick="
                    verifyOTP('${email}')
                "
            >

                Verify OTP

            </button>


            <button
                class="btn btn-secondary"
                style="
                    width:100%;
                    margin-top:10px;
                "
                onclick="
                    resendOTP('${email}')
                "
            >

                Resend OTP

            </button>

        </div>

    `;

}


/* =====================================================
   VERIFY OTP API
===================================================== */

async function verifyOTP(email) {

    const message =
        document.getElementById(
            "otpMessage"
        );

    try {

        await api(

            "/auth/verify-otp",

            {

                method: "POST",

                body:
                    JSON.stringify({

                        email,

async function loadProducts(query = "") {

    try {

        let endpoint = "/prod";

        if (query && query.trim()) {

            endpoint =
                "/prod/search?q=" +
                encodeURIComponent(
                    query.trim()
                );

        }

        const response =
            await api(endpoint);

        console.log(
            "Products API Response:",
            response
        );

        const data =
            response.data ??
            response;

        let list = [];

        if (Array.isArray(data)) {

            list = data;

        }

        else if (Array.isArray(data.products)) {

            list = data.products;

        }

        else if (Array.isArray(data.rows)) {

            list = data.rows;

        }

        else if (Array.isArray(data.data)) {

            list = data.data;

        }

        renderProducts(list);

    }

    catch (error) {

        console.error(
            "Product loading error:",
            error
        );

        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="alert alert-error">

                ${error.message}

            </div>

    }

}

/* =====================================================
   RENDER CART
===================================================== */

function renderCart(cartResponse) {

    console.log(
        "Rendering cart response:",
        cartResponse
    );

    let items = [];

    /*
        Backend response:

        {
            success: true,
            message: "Cart fetched successfully.",
            data: {
                cart: [...]
            }
        }
    */

    if (
        cartResponse &&
        cartResponse.data &&
        Array.isArray(cartResponse.data.cart)
    ) {

        items = cartResponse.data.cart;

    }

    /*
        Direct array fallback
    */

    else if (
        Array.isArray(cartResponse)
    ) {

        items = cartResponse;

    }

    /*
        Other possible response structures
    */

    else if (
        cartResponse &&
        Array.isArray(cartResponse.cart)
    ) {

        items = cartResponse.cart;

    }

    else if (
        cartResponse &&
        cartResponse.data &&
        Array.isArray(cartResponse.data.items)
    ) {

        items = cartResponse.data.items;

    }

    else if (
        cartResponse &&
        Array.isArray(cartResponse.items)
    ) {

        items = cartResponse.items;

    }

    else if (
        cartResponse &&
        cartResponse.data &&
        Array.isArray(cartResponse.data.cart_items)
    ) {

        items = cartResponse.data.cart_items;

    }

    else if (
        cartResponse &&
        Array.isArray(cartResponse.cart_items)
    ) {

        items = cartResponse.cart_items;

    }

    else if (
        cartResponse &&
        cartResponse.data &&
        Array.isArray(cartResponse.data.cartItems)
    ) {

        items = cartResponse.data.cartItems;

    }

    else if (
        cartResponse &&
        Array.isArray(cartResponse.cartItems)
    ) {

        items = cartResponse.cartItems;

    }

    else if (
        cartResponse &&
        cartResponse.data &&
        Array.isArray(cartResponse.data.rows)
    ) {

        items = cartResponse.data.rows;

    }

    else if (
        cartResponse &&
        Array.isArray(cartResponse.rows)
    ) {

        items = cartResponse.rows;

    }


    console.log(
        "Extracted cart items:",
        items
    );


    /*
        EMPTY CART
    */

    if (!items.length) {

        document.getElementById(
            "cart"
        ).innerHTML = `

            <div class="card center">

                <h3>
                    Your cart is empty 🛒
                </h3>

                <p
                    style="
                        margin-top:8px;
                        color:#64748b;
                    "
                >
                    Add products to your cart
                    to see them here.
                </p>

                <button
                    class="btn"
                    style="
                        margin-top:15px;
                    "
                    onclick="showProducts()"
                >
                    Shop Now
                </button>

            </div>

        `;

        return;

    }


    /*
        CALCULATE TOTAL
    */

    let total = 0;


    /*
        CART HTML
    */

    let html = `

        <div class="card">

            <h3
                style="
                    margin-bottom:15px;
                "
            >

                ${items.length}
                ${items.length === 1
                    ? "Item"
                    : "Items"}

            </h3>

    `;


    /*
        RENDER EACH CART ITEM
    */

    items.forEach(
        item => {

            const itemId =
                item.item_id ??
                item.id;


            const variantId =
                item.variant_id;


            const quantity =
                Number(
                    item.quantity || 1
                );


            const unitPrice =
                Number(
                    item.final_price ??
                    item.selling_price ??
                    item.price ??
                    0
                );


            const itemTotal =
                Number(
                    item.total_price ??
                    (
                        unitPrice *
                        quantity
                    )
                );


            total += itemTotal;


            const productName =
                item.product_name ??
                item.name ??
                "Product";


            const variantName =
                item.variant_name ??
                "";


            const sku =
                item.sku ??
                "";


            html += `

                <div
                    class="cart-item"
                >

                    <!-- PRODUCT INFORMATION -->

                    <div>

                        <h3>
                            ${productName}
                        </h3>


                        ${
                            variantName
                                ? `
                                    <p
                                        style="
                                            color:#64748b;
                                            margin-top:5px;
                                        "
                                    >
                                        ${variantName}
                                    </p>
                                  `
                                : ""
                        }


                        ${
                            sku
                                ? `
                                    <p
                                        style="
                                            color:#94a3b8;
                                            font-size:12px;
                                            margin-top:4px;
                                        "
                                    >
                                        SKU:
                                        ${sku}
                                    </p>
                                  `
                                : ""
                        }


                        <p
                            style="
                                margin-top:8px;
                                font-weight:600;
                            "
                        >
                            ₹${unitPrice.toFixed(2)}
                            / item
                        </p>

                    </div>


                    <!-- QUANTITY -->

                    <div
                        class="quantity"
                    >

                        <button
                            onclick="
                                updateCartItem(
                                    ${itemId},
                                    ${quantity - 1}
                                )
                            "
                        >
                            −
                        </button>


                        <b>
                            ${quantity}
                        </b>


                        <button
                            onclick="
                                updateCartItem(
                                    ${itemId},
                                    ${quantity + 1}
                                )
                            "
                        >
                            +
                        </button>

                    </div>


                    <!-- PRICE -->

                    <div
                        style="
                            text-align:right;
                        "
                    >

                        <strong>
                            ₹${itemTotal.toFixed(2)}
                        </strong>


                        <br>


                        <button
                            class="
                                btn
                                btn-danger
                            "
                            style="
                                margin-top:8px;
                                padding:7px 10px;
                            "
                            onclick="
                                removeCartItem(
                                    ${itemId}
                                )
                            "
                        >
                            Remove
                        </button>

                    </div>

                </div>

            `;

        }
    );


    /*
        CART SUMMARY
    */

    html += `

            <div class="total">

                <strong>
                    Cart Total
                </strong>

                <strong
                    style="
                        font-size:20px;
                    "
                >
                    ₹${total.toFixed(2)}
                </strong>

            </div>


            <button
                class="btn"
                style="
                    width:100%;
                    margin-top:15px;
                "
                onclick="checkout()"
            >
                Proceed to Checkout
            </button>


        </div>

    `;


    /*
        DISPLAY CART
    */

    const cartElement =
        document.getElementById("cart");


    if (!cartElement) {

        console.error(
            'Element with id="cart" was not found.'
        );

        return;

    }


    cartElement.innerHTML =
        html;

}

/* =====================================================
   UPDATE CART COUNT
===================================================== */

async function updateCartCount(
    cart = null
) {

    if (!accessToken) {

        document.getElementById(
            "cartCount"
        ).textContent = "";

        return;

    }


    try {

        /*
            If cart was not supplied,
            fetch it from backend.
        */

        if (!cart) {

            const response =
                await api(
                    "/cart"
                );

            cart =
                response?.data?.cart || [];

        }


        /*
            Normalize cart into an array.
        */

        let items = [];


        if (Array.isArray(cart)) {

            items = cart;

        }

        else if (
            cart &&
            Array.isArray(cart.cart)
        ) {

            items = cart.cart;

        }

        else if (
            cart &&
            Array.isArray(cart.items)
        ) {

            items = cart.items;

        }

        else if (
            cart &&
            Array.isArray(cart.cart_items)
        ) {

            items = cart.cart_items;

        }

        else if (
            cart &&
            Array.isArray(cart.cartItems)
        ) {

            items = cart.cartItems;

        }

        else if (
            cart &&
            Array.isArray(cart.rows)
        ) {

            items = cart.rows;

        }


        /*
            Calculate total quantity.
        */

        const count =
            items.reduce(

                (
                    total,
                    item
                ) => {

                    return (
                        total +
                        Number(
                            item.quantity || 0
                        )
                    );

                },

                0

            );


        document.getElementById(
            "cartCount"
        ).textContent =
            count > 0
                ? `(${count})`
                : "";

    }

    catch (error) {

        console.error(
            "Cart count error:",
            error
        );

    }

}

async function placeOrder() {

    try {

        if (!accessToken) {

            closeModal();

            showLogin();

            return;

        }


        const addressElement =
            document.getElementById(
                "checkoutAddress"
            );

        const paymentElement =
            document.getElementById(
                "paymentMethod"
            );


        if (!addressElement) {

            alert(
                "Please select a delivery address."
            );

            return;

        }


        if (!paymentElement) {

            alert(
                "Please select a payment method."
            );

            return;

        }


        const addressId =
            Number(
                addressElement.value
            );


        const paymentMethod =
            paymentElement.value;


        /*
            Create the order first.
        */

        const response =
            await api(

                "/order",

                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            address_id:
                                addressId,

                            payment_method:
                                paymentMethod,

                            notes: ""

                        })

                }

            );


        console.log(
            "PLACE ORDER RESPONSE:",
            response
        );


        const order =
            response?.data?.order ||
            response?.data ||
            response;


        /*
            Close checkout modal.
        */

        closeModal();


        /*
            ONLINE PAYMENT
        */

        if (
            paymentMethod ===
            "ONLINE"
        ) {

            await createPayment(
                order
            );

            return;

        }


        /*
            COD
        */

        alert(
            "Order placed successfully."
        );

        showOrders();

    }

    catch (error) {

        console.error(
            "Place order error:",
            error
        );

        alert(
            error.message
        );

    }

}

/* =====================================================
   RAZORPAY ONLINE PAYMENT
===================================================== */

async function createPayment(
    order
) {

    try {

        if (!accessToken) {

            showLogin();

            return;

        }


        /*
            Get order ID from different
            possible backend response structures.
        */

        const orderId =
            Number(
                order?.order_id ??
                order?.orderId ??
                order?.id
            );


        if (!orderId) {

            console.error(
                "Invalid order response:",
                order
            );

            throw new Error(
                "Order ID was not returned by the server."
            );

        }


        console.log(
            "Creating Razorpay payment for order:",
            orderId
        );


        /*
            Create Razorpay payment order
        */

        const paymentResponse =
            await api(

                "/pay/create",

                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            orderId:
                                orderId,

                            paymentMethod:
                                "UPI",

                            paymentGateway:
                                "RAZORPAY"

                        })

                }

            );


        console.log(
            "PAYMENT CREATE RESPONSE:",
            paymentResponse
        );


        const payment =
            paymentResponse?.data ||
            paymentResponse;


        /*
            Validate Razorpay data
        */

        const razorpayKey =
            payment.key ||
            payment.razorpayKey;


        const razorpayOrderId =
            payment.razorpayOrderId ||
            payment.gatewayOrderId;


        const amount =
            payment.amount;


        const currency =
            payment.currency ||
            "INR";


        const paymentId =
            payment.paymentId;


        if (
            !razorpayKey ||
            !razorpayOrderId ||
            !amount ||
            !paymentId
        ) {

            console.error(
                "Invalid payment response:",
                payment
            );

            throw new Error(
                "Invalid Razorpay payment details received from server."
            );

        }


        /*
            Razorpay Checkout configuration
        */

        const options = {

            key:
                razorpayKey,

            amount:
                amount,

            currency:
                currency,

            order_id:
                razorpayOrderId,

            name:
                "Instant Delivery",

            description:
                `Online Payment - Order #${orderId}`,

            theme: {

                color:
                    "#2563eb"

            },


            /*
                Payment successful
            */

            handler:
                async function (
                    razorpayResponse
                ) {

                    try {

                        console.log(
                            "RAZORPAY RESPONSE:",
                            razorpayResponse
                        );


                        /*
                            Verify payment with backend
                        */

                        const verifyResponse =
                            await api(

                                "/pay/verify",

                                {

                                    method: "POST",

                                    body:
                                        JSON.stringify({

                                            paymentId:
                                                paymentId,

                                            gatewayPaymentId:
                                                razorpayResponse
                                                    .razorpay_payment_id,

                                            gatewayOrderId:
                                                razorpayResponse
                                                    .razorpay_order_id,

                                            gatewaySignature:
                                                razorpayResponse
                                                    .razorpay_signature,

                                            gatewayResponse:
                                                razorpayResponse

                                        })

                                }

                            );


                        console.log(
                            "PAYMENT VERIFY RESPONSE:",
                            verifyResponse
                        );


                        if (
                            verifyResponse.success
                        ) {

                            alert(
                                "✅ Payment successful! Order placed."
                            );


                            /*
                                Refresh cart count.
                            */

                            await updateCartCount();


                            /*
                                Show orders.
                            */

                            showOrders();

                        }

                        else {

                            alert(
                                "Payment verification failed."
                            );

                        }

                    }

                    catch (error) {

                        console.error(
                            "Payment verification error:",
                            error
                        );

                        alert(
                            "Payment was completed, but verification failed. Please check your order status."
                        );

                    }

                },


            /*
                Razorpay closes
            */

            modal: {

                ondismiss:
                    function () {

                        console.log(
                            "Razorpay checkout closed."
                        );

                    }

            }

        };


        /*
            Open Razorpay
        */

        const razorpay =
            new Razorpay(
                options
            );


        razorpay.on(
            "payment.failed",
            function (
                response
            ) {

                console.error(
                    "Razorpay payment failed:",
                    response
                );

                alert(
                    "❌ Payment failed. Please try again."
                );

            }
        );


        razorpay.open();

    }

    catch (error) {

        console.error(
            "Payment creation error:",
            error
        );

        alert(
            error.message ||
            "Unable to start online payment."
        );

    }

}

                            <i class="fa-solid fa-file-lines"></i>
                            Resume
                        </a>

                    </div>

                </div>

            </div>

        </div>

    `;

}


function setPaymentLoading(
    loading
) {

    const loader =
        document.getElementById(
            "paymentLoader"
        );

    const button =
        document.getElementById(
            "paymentPayBtn"
        );

    if (loader) {

        loader.style.display =
            loading
                ? "block"
                : "none";

    }

    if (button) {

        button.disabled =
            loading;

    }

}


function logPaymentResponse(
    data
) {

    const response =
        document.getElementById(
            "paymentResponse"
        );

    if (!response) {

        return;

    }

    if (
        typeof data === "string"
    ) {

        response.textContent =
            data;

        return;

    }

    try {

        response.textContent =
            JSON.stringify(
                data,
                null,
                4
            );

    }

    catch {

        response.textContent =
            String(data);

    }

}


function setPaymentStatus(
    status,
    type = "success"
) {

    const element =
        document.getElementById(
            "paymentStatus"
        );

    if (!element) {

        return;

    }

    element.textContent =
        status;

    element.className =
        "payment-badge " +
        type;

}


async function processIntegratedPayment() {

    if (!accessToken) {

        showLogin();

        return;

    }

    const orderInput =
        document.getElementById(
            "paymentOrderId"
        );

    const typeInput =
        document.getElementById(
            "paymentType"
        );

    if (!orderInput || !typeInput) {

        return;

    }

    const orderId =
        Number(
            orderInput.value
        );

    const paymentType =
        typeInput.value;

    if (!orderId || orderId < 1) {

        alert(
            "Please enter a valid Order ID."
        );

        return;

    }

    setPaymentLoading(true);

    setPaymentStatus(
        "Processing",
        "success"
    );

    try {

        const endpoint =
            paymentType === "retry"
                ? "/pay/retry"
                : "/pay/create";

        const payload =
            paymentType === "retry"
                ? {
                    orderId
                }
                : {
                    orderId,
                    paymentMethod: "UPI",
                    paymentGateway: "RAZORPAY"
                };

        const paymentResponse =
            await api(

                endpoint,

                {

                    method: "POST",

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );

        logPaymentResponse(
            paymentResponse
        );

        const payment =
            paymentResponse?.data ||
            paymentResponse;

        const razorpayKey =
            payment?.key ||
            payment?.razorpayKey;

        const razorpayOrderId =
            payment?.razorpayOrderId ||
            payment?.gatewayOrderId;

        const amount =
            payment?.amount;

        const currency =
            payment?.currency ||
            "INR";

        const paymentId =
            payment?.paymentId;

        if (
            !razorpayKey ||
            !razorpayOrderId ||
            !amount ||
            !paymentId
        ) {

            throw new Error(
                "Invalid Razorpay payment details received from server."
            );

        }

        setPaymentLoading(false);

        setPaymentStatus(
            "Connected",
            "success"
        );

        const options = {

            key:
                razorpayKey,

            amount:
                amount,

            currency:
                currency,

            order_id:
                razorpayOrderId,

            name:
                "Instant Delivery",

            description:
                paymentType === "retry"
                    ? `Retry Payment - Order #${orderId}`
                    : `Online Payment - Order #${orderId}`,

            theme: {
                color: "#2563eb"
            },

            handler:
                async function (
                    razorpayResponse
                ) {

                    setPaymentLoading(true);

                    setPaymentStatus(
                        "Verifying",
                        "success"
                    );

                    try {

                        const verifyResponse =
                            await api(

                                "/pay/verify",

                                {

                                    method: "POST",

                                    body:
                                        JSON.stringify({

                                            paymentId,

                                            gatewayPaymentId:
                                                razorpayResponse
                                                    .razorpay_payment_id,

                                            gatewayOrderId:
                                                razorpayResponse
                                                    .razorpay_order_id,

                                            gatewaySignature:
                                                razorpayResponse
                                                    .razorpay_signature,

                                            gatewayResponse:
                                                razorpayResponse

                                        })

                                }

                            );

                        logPaymentResponse(
                            verifyResponse
                        );

                        setPaymentStatus(
                            "Payment Successful",
                            "success"
                        );

                        alert(
                            "Payment verified successfully."
                        );

                        setPaymentLoading(false);

                        showOrders();

                    }

                    catch (error) {

                        console.error(
                            "Payment verification error:",
                            error
                        );

                        setPaymentStatus(
                            "Verification Failed",
                            "error"
                        );

                        logPaymentResponse({
                            success: false,
                            message:
                                error.message
                        });

                        setPaymentLoading(
                            false
                        );

                        alert(
                            error.message
                        );

                    }

                },

            modal: {

                ondismiss:
                    function () {

                        setPaymentLoading(
                            false
                        );

                        setPaymentStatus(
                            "Payment Cancelled",
                            "error"
                        );

                    }

            }

        };

        const razorpay =
            new Razorpay(
                options
            );

        razorpay.on(
            "payment.failed",
            function (
                response
            ) {

                setPaymentLoading(
                    false
                );

                setPaymentStatus(
                    "Payment Failed",
                    "error"
                );

                logPaymentResponse(
                    response
                );

            }
        );

        razorpay.open();

    }

    catch (error) {

        console.error(
            "Integrated payment error:",
            error
        );

        setPaymentLoading(
            false
        );

        setPaymentStatus(
            "Error",
            "error"
        );

        logPaymentResponse({
            success: false,
            message:
                error.message
        });

        alert(
            error.message
        );

    }

}

/* =====================================================
   ORDERS
===================================================== */

async function showOrders() {

    if (!accessToken) {

        showLogin();

        return;

    }

    document.getElementById(
        "app"
    ).innerHTML = `

        <h2>
            My Orders
        </h2>

        <div
            id="orders"
            style="
                margin-top:20px;
            "
        >

            Loading...

        </div>

    `;

    try {

        const response =
            await api(
                "/order"
            );

        const data =
            response.data ||
            response;

        const orders =
            Array.isArray(data)
                ? data
                : data.orders ||
                  data.rows ||
                  [];

        renderOrders(
            orders
        );

    }

    catch (error) {

        document.getElementById(
            "orders"
        ).innerHTML = `

            <div class="alert alert-error">

                ${error.message}

            </div>

        `;

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
    orders
) {

    if (!orders.length) {

        document.getElementById(
            "orders"
        ).innerHTML = `

            <div class="card center">

                <h3>
                    No orders yet.
                </h3>

                <button
                    class="btn"
                    style="margin-top:15px"
                    onclick="showProducts()"
                >

                    Start Shopping

                </button>

            </div>

        `;

        return;

    }

    document.getElementById(
        "orders"
    ).innerHTML =
        orders.map(

            order => `

                <div
                    class="card"
                    style="
                        margin-bottom:15px;
                    "
                >

                    <div
                        style="
                            display:flex;
                            justify-content:
                                space-between;
                            gap:15px;
                        "
                    >

                        <div>

                            <h3>

                                Order #

                                ${
                                    order.order_number ||
                                    order.id
                                }

                            </h3>

                            <p
                                style="
                                    color:#64748b;
                                    margin-top:5px;
                                "
                            >

                                ${
                                    order.created_at ||
                                    ""
                                }

                            </p>

                        </div>


                        <span class="badge">

                            ${
                                order.order_status ||
                                order.status ||
                                "PLACED"
                            }

                        </span>

                    </div>


                    <div
                        class="price"
                        style="margin-top:15px"
                    >

                        ₹${
                            Number(
                                order.total_amount ||
                                0
                            ).toFixed(2)
                        }

                    </div>


                    ${
                        (
                            order.order_status ||
                            order.status
                        ) !== "DELIVERED" &&
                        (
                            order.order_status ||
                            order.status
                        ) !== "CANCELLED"
                            ?

                            `
                                <button
                                    class="
                                        btn
                                        btn-danger
                                    "
                                    onclick="
                                        cancelOrder(
                                            ${order.id}
                                        )
                                    "
                                >

                                    Cancel Order

                                </button>
                            `

                            :

                            ""

                    }

                </div>

            `

        ).join("");

}


/* =====================================================
   CANCEL ORDER
===================================================== */

async function cancelOrder(
    orderId
) {

    if (
        !confirm(
            "Cancel this order?"
        )
    ) {

        return;

    }

    try {

        await api(

            `/order/${orderId}`,

            {

                method: "DELETE"

            }

        );

        alert(
            "Order cancelled."
        );

        showOrders();

    }

    catch (error) {

        alert(
            error.message
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
    html
) {

    document.getElementById(
        "modalContent"
    ).innerHTML =
        html;

    document.getElementById(
        "modal"
    ).classList.remove(
        "hidden"
    );

}


function closeModal() {

    document.getElementById(
        "modal"
    ).classList.add(
        "hidden"
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

updateNavigation();

showHome();

if (accessToken) {

    updateCartCount();

}
